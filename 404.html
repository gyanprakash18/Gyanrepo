<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Gyan Prakash Kumar</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; cursor: auto; }
  .error-wrap { text-align: center; padding: 40px 24px; }
  .error-code {
    font-size: clamp(5rem, 18vw, 10rem); font-weight: 800; line-height: 1;
    background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 10px;
  }
  .error-wrap h1 { font-size: 1.5rem; margin-bottom: 12px; }
  .error-wrap p { color: var(--text-secondary); max-width: 420px; margin: 0 auto 34px; line-height: 1.7; }
  .error-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .error-glow {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.15), transparent 70%);
    z-index: -1;
  }
</style>
</head>
<body>
  <div class="error-glow" aria-hidden="true"></div>
  <div class="error-wrap">
    <div class="error-code">404</div>
    <h1>This page went off the grid.</h1>
    <p>The page you're looking for doesn't exist, was moved, or the link is broken. Let's get you back on track.</p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
      <a href="index.html#contact" class="btn btn-outline"><i class="fa-regular fa-paper-plane"></i> Contact Me</a>
    </div>
  </div>
</body>
</html>
